<!DOCTYPE html>
<html lang="{{ get_locale().language }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ _('No Project Access') }} — {{ PROJECT.company }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .wrap { width: 100%; max-width: 420px; padding: 1rem; }
    .card-panel { border: 0; border-radius: 1rem; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    .icon {
      width: 56px; height: 56px; border-radius: .75rem;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; color: #fff; margin: 0 auto;
    }
    .auth-locale-btn {
      border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.05);
      color: #94a3b8; font-size: .68rem; font-weight: 700; letter-spacing: .02em;
      padding: 4px 12px; border-radius: 999px; transition: all .15s;
    }
    .auth-locale-btn:hover { color: #e2e8f0; border-color: rgba(255,255,255,.3); }
    .auth-locale-btn.active { background: #6366f1; border-color: #6366f1; color: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card card-panel">
      <div class="card-body p-4 p-sm-5 text-center">
        <div class="icon mb-3"><i class="bi bi-shield-lock"></i></div>
        <h4 class="fw-bold mb-2">{{ _('No Project Access') }}</h4>
        <p class="text-muted small mb-4">
          {{ _('Your account (%(username)s) isn\'t assigned to any project yet. Ask a superadmin to grant you access.', username='<strong>' ~ (current_user.username if current_user else '') ~ '</strong>') | safe }}
        </p>
        <form action="{{ url_for('logout') }}" method="POST">
          <button type="submit" class="btn btn-outline-secondary w-100">
            <i class="bi bi-box-arrow-right me-1"></i>{{ _('Sign out') }}
          </button>
        </form>
      </div>
    </div>
    {% include '_locale_switcher_auth.html' %}
  </div>
</body>
</html>
