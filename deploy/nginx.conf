server {
    listen 80;
    server_name 148.251.208.138;

    # Excel imports (forecasts/employees) can be several MB; default nginx
    # cap (1m) would reject them with 413 before Flask ever sees the upload.
    client_max_body_size 25m;

    # Only /static/ (app's own CSS/JS/images) is served directly by nginx.
    # Deliberately NOT doing the same for /uploads/ — those are employee
    # documents/forecasts served via authenticated Flask routes
    # (send_file() behind login/role checks in app.py). Serving that path
    # as static files would bypass auth entirely and leak them to anyone
    # with the URL, so /uploads/ must go through the proxy below like
    # everything else.
    location /static/ {
        alias /opt/ai_workforce_scheduler/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The AI assistant streams replies over SSE - buffering here would
        # hold the whole response until it's done instead of streaming it.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
